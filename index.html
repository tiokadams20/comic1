
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>PDF Reader</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <style>
        body {
            background: #f1f3f5;
        }

        .pdf-toolbar {
            position: sticky;
            top: 0;
            z-index: 10;
        }

        #pdf-container {
            min-height: 70vh;
            padding: 20px;
            text-align: center;
        }

        #pdf-container canvas {
            display: block;
            max-width: 100%;
            height: auto !important;
            margin: 0 auto 20px;
            background: white;
            box-shadow: 0 2px 8px #0002;
        }

        #status {
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <span class="navbar-brand mb-0">PDF Reader</span>
        <a href="xxx.pdf" download class="btn btn-outline-light btn-sm">
            Download PDF
        </a>
    </div>
</nav>

<div class="pdf-toolbar bg-white border-bottom p-2">
    <div class="container-fluid d-flex flex-wrap
                justify-content-center align-items-center gap-2">

        <button id="prev" class="btn btn-outline-primary btn-sm">
            Previous
        </button>

        <span class="small">
            Page <span id="page-num">-</span> /
            <span id="page-count">-</span>
        </span>

        <button id="next" class="btn btn-outline-primary btn-sm">
            Next
        </button>

        <div class="vr mx-1"></div>

        <button id="zoom-out" class="btn btn-secondary btn-sm">
            −
        </button>

        <span id="zoom-level" class="small">100%</span>

        <button id="zoom-in" class="btn btn-secondary btn-sm">
            +
        </button>
    </div>
</div>

<main class="container-fluid p-0">
    <div id="status" class="alert alert-info rounded-0 mb-0">
        Loading PDF...
    </div>

    <div id="pdf-container"></div>
</main>

<!-- PDF.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>
    const PDF_URL = "./xxx.pdf";

    pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

    const container = document.getElementById("pdf-container");
    const status = document.getElementById("status");
    const pageNum = document.getElementById("page-num");
    const pageCount = document.getElementById("page-count");
    const zoomLevel = document.getElementById("zoom-level");
    const prevButton = document.getElementById("prev");
    const nextButton = document.getElementById("next");

    let pdfDoc = null;
    let currentPage = 1;
    let zoom = 1;
    let rendering = false;
    let pendingPage = null;

    async function renderPage(number) {
        if (rendering) {
            pendingPage = number;
            return;
        }

        rendering = true;

        try {
            const page = await pdfDoc.getPage(number);
            const viewport = page.getViewport({ scale: zoom });
            const canvas = document.createElement("canvas");
            const context = canvas.getContext("2d");

            // High-resolution canvas for sharper text
            const outputScale = window.devicePixelRatio || 1;

            canvas.width = Math.floor(
                viewport.width * outputScale
            );
            canvas.height = Math.floor(
                viewport.height * outputScale
            );

            canvas.style.width = viewport.width + "px";
            canvas.style.height = viewport.height + "px";

            container.replaceChildren(canvas);

            await page.render({
                canvasContext: context,
                viewport: viewport,
                transform: outputScale !== 1
                    ? [outputScale, 0, 0, outputScale, 0, 0]
                    : null
            }).promise;

            currentPage = number;
            pageNum.textContent = currentPage;
            zoomLevel.textContent = Math.round(zoom * 100) + "%";

            prevButton.disabled = currentPage <= 1;
            nextButton.disabled = currentPage >= pdfDoc.numPages;

            status.classList.add("d-none");
        } catch (error) {
            showError("Could not render this PDF page.", error);
        } finally {
            rendering = false;

            if (pendingPage !== null) {
                const nextPage = pendingPage;
                pendingPage = null;
                renderPage(nextPage);
            }
        }
    }

    function showError(message, error) {
        status.className = "alert alert-danger rounded-0 mb-0";
        status.textContent = message + "\n" + error.message;
    }

    prevButton.addEventListener("click", () => {
        if (pdfDoc && currentPage > 1) {
            renderPage(currentPage - 1);
        }
    });

    nextButton.addEventListener("click", () => {
        if (pdfDoc && currentPage < pdfDoc.numPages) {
            renderPage(currentPage + 1);
        }
    });

    document.getElementById("zoom-in").addEventListener("click", () => {
        if (pdfDoc && zoom < 3) {
            zoom = Math.min(3, zoom + 0.2);
            renderPage(currentPage);
        }
    });

    document.getElementById("zoom-out").addEventListener("click", () => {
        if (pdfDoc && zoom > 0.4) {
            zoom = Math.max(0.4, zoom - 0.2);
            renderPage(currentPage);
        }
    });

    async function initPDF() {
        try {
            if (typeof pdfjsLib === "undefined") {
                throw new Error(
                    "PDF.js failed to load. Check your internet connection."
                );
            }

            pdfDoc = await pdfjsLib.getDocument(PDF_URL).promise;

            pageCount.textContent = pdfDoc.numPages;

            await renderPage(1);
        } catch (error) {
            showError(
                "Unable to load xxx.pdf. Check the file path and server.",
                error
            );
        }
    }

    initPDF();
</script>

</body>
</html>
