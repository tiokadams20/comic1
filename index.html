
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Reader</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin: 0;
            padding: 12px;
            background: #333;
            color: white;
            text-align: center;
        }

        iframe {
            width: 100%;
            height: calc(100vh - 48px);
            border: none;
        }
    </style>
</head>
<body>
    <h2>PDF Reader</h2>

    <iframe src="xxx.pdf">
        Your browser does not support PDF viewing.
        <a href="xxx.pdf">Download PDF</a>
    </iframe>
</body>
</html>
